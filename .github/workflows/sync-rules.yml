name: Sync NG Rules

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest NG rules
        env:
          SYNC_MODE: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
        run: python server/sync_rules.py

      - name: Commit updated rules
        run: |
          if git diff --quiet overlay/assets/rules_index.json overlay/assets/rules_meta.json && [ -z "$(git status --porcelain overlay/assets/rules_meta.json)" ]; then
            echo "No changes in rules."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlay/assets/rules_index.json overlay/assets/rules_meta.json
          git commit -m "Auto-sync NG rules database (${{ github.event_name }})"
          git push